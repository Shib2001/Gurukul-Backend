services:
  postgres:
    image: postgres:16
    container_name: gurukul-postgres
    environment:
      POSTGRES_DB: gurukul
      POSTGRES_USER: gurukul
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gurukul-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
